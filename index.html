<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f1a12">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Kristallwacht – Endless Fantasy Defense</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="top">
      <div id="tray">
        <div id="mana"><canvas id="manaIcon" width="80" height="80"></canvas><b id="manaVal">150</b></div>
        <div id="cards"></div>
      </div>
      <div id="bar">
        <span id="waveLbl">Welle 1</span>
        <span id="hearts"></span>
        <span id="score"></span>
        <span id="waveProg" title="Fortschritt der Welle"><i></i></span>
        <button id="btnSpeed" class="btn" title="Tempo (F)">1×</button>
        <button id="btnPause" class="btn" title="Pause (Leertaste)">⏸</button>
      </div>
    </div>
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="popup"></div>
      <div id="toast"></div>
    </div>
  </div>
  <div id="overlay" class="overlay"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
